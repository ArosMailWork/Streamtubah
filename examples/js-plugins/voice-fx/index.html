<!doctype html>
<!-- Sample Streamtubah plugin: microphone → Web Audio effect → "Plugin Audio" source.
     Copy this folder to <app data>/plugins-js/voice-fx and enable it in Settings → Plugins. -->
<meta charset="utf-8">
<title>Voice FX</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #16181d; color: #e8e8e8; margin: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; }
  select, input[type=range] { width: 100%; }
  button { padding: 6px 12px; margin-top: 12px; }
  .status { margin-top: 14px; font-size: 12px; color: #9aa; white-space: pre-line; }
  meter { width: 100%; }
</style>
<h1>🎙 Voice FX</h1>
<label>Effect
  <select id="effect">
    <option value="none">None (clean)</option>
    <option value="robot" selected>Robot</option>
    <option value="radio">Radio</option>
    <option value="echo">Echo</option>
    <option value="cave">Cave</option>
  </select>
</label>
<label>Amount <input id="amount" type="range" min="0" max="1" step="0.01" value="0.7"></label>
<label>Output volume <input id="gain" type="range" min="0" max="2" step="0.01" value="1"></label>
<label>Level <meter id="level" min="0" max="1"></meter></label>
<button id="restart">Restart microphone</button>
<div class="status" id="status">Starting…</div>

<script>
const CHANNEL = "voice-fx";
const SOURCE_NAME = "Voice FX";
const $ = (id) => document.getElementById(id);
const status = (t) => { $("status").textContent = t; console.log(t); };
const settings = JSON.parse(localStorage.getItem("voice-fx") || "{}");
for (const k of ["effect", "amount", "gain"]) if (settings[k] !== undefined) $(k).value = settings[k];

let ctx, mic, chain = [], link, analyser, out;

/** Creates the "Voice FX" Plugin Audio source in the current scene once. */
async function ensureSource() {
  const { inputs } = await streamtubah.request("GetInputList", { inputKind: "streamtubah_plugin_audio" });
  if (inputs.some((i) => i.inputName === SOURCE_NAME)) return;
  const { currentProgramSceneName } = await streamtubah.request("GetCurrentProgramScene");
  await streamtubah.request("CreateInput", {
    sceneName: currentProgramSceneName, inputName: SOURCE_NAME,
    inputKind: "streamtubah_plugin_audio", inputSettings: { channel: CHANNEL },
  });
  console.info(`Added "${SOURCE_NAME}" to scene "${currentProgramSceneName}". Mute your normal Mic in the mixer.`);
}

function impulse(seconds) {
  const len = ctx.sampleRate * seconds, buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  return buf;
}

/** Builds the effect graph between `mic` and `out`. */
function buildEffect() {
  for (const n of chain) n.disconnect();
  mic.disconnect();
  chain = [];
  const amount = +$("amount").value;
  const effect = $("effect").value;
  const dry = ctx.createGain(), wet = ctx.createGain();
  dry.gain.value = effect === "none" ? 1 : 1 - amount;
  wet.gain.value = effect === "none" ? 0 : amount;
  mic.connect(dry).connect(out);
  chain.push(dry, wet);
  let fx;
  if (effect === "robot") {
    // Ring modulation: multiply the voice with a 60 Hz tone.
    const ring = ctx.createGain(); ring.gain.value = 0;
    const osc = ctx.createOscillator(); osc.frequency.value = 60; osc.start();
    osc.connect(ring.gain);
    fx = ring; chain.push(osc);
  } else if (effect === "radio") {
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 500;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3000;
    const drive = ctx.createWaveShaper();
    drive.curve = Float32Array.from({ length: 1024 }, (_, i) => Math.tanh((i / 512 - 1) * 4));
    hp.connect(lp).connect(drive);
    fx = hp; chain.push(lp, drive);
    drive.connect(wet);
  } else if (effect === "echo") {
    const delay = ctx.createDelay(1); delay.delayTime.value = 0.28;
    const fb = ctx.createGain(); fb.gain.value = 0.45;
    delay.connect(fb).connect(delay);
    fx = delay; chain.push(fb);
  } else if (effect === "cave") {
    const conv = ctx.createConvolver(); conv.buffer = impulse(2.5);
    fx = conv;
  }
  if (fx) {
    mic.connect(fx);
    if (effect !== "radio") fx.connect(wet);
    chain.push(fx);
  }
  wet.connect(out);
  localStorage.setItem("voice-fx", JSON.stringify({ effect, amount, gain: $("gain").value }));
}

async function start() {
  try {
    if (link) link.close();
    if (ctx) await ctx.close();
    ctx = new AudioContext({ sampleRate: streamtubah.audio.SAMPLE_RATE });
    const media = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: false } });
    mic = ctx.createMediaStreamSource(media);
    out = ctx.createGain(); out.gain.value = +$("gain").value;
    analyser = ctx.createAnalyser(); out.connect(analyser);
    buildEffect();
    await ensureSource();
    link = await streamtubah.audio.connectNode(out, CHANNEL);
    if (ctx.state !== "running") await ctx.resume();
    status(`Running · ${media.getAudioTracks()[0].label}\nSending to Plugin Audio channel "${CHANNEL}".`);
  } catch (e) {
    status(`Error: ${e.message || e}`);
  }
}

$("effect").onchange = $("amount").oninput = () => mic && buildEffect();
$("gain").oninput = () => { if (out) out.gain.value = +$("gain").value; buildEffect(); };
$("restart").onclick = start;
setInterval(() => {
  if (!analyser) return;
  const d = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(d);
  $("level").value = Math.sqrt(d.reduce((a, v) => a + v * v, 0) / d.length) * 4;
}, 100);
start();
</script>
