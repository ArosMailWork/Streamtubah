[package]
name = "streamtubah"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "streamtubah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libobs = "=6.0.0"
vsprintf = "2"
tauri-plugin-dialog = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Devices_Properties", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Dxgi", "Win32_Security_Cryptography"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.3"
ureq = { version = "3", features = ["json"] }
native-tls = "0.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package.metadata]
libobs-version = "32.1.0"
libobs-cache-dir = "../obs-build"
