<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Streamtubah Alert Box</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .alert { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 82vw; }
  .media img, .media video { max-width: 460px; max-height: 380px; display: block; }
  .icon { font-size: 150px; line-height: 1; filter: drop-shadow(0 8px 22px rgba(0,0,0,.45)); animation: pulse 1.3s ease-in-out infinite; }
  .ring { position: relative; }
  .ring::before { content: ""; position: absolute; inset: -26px; border-radius: 50%; border: 6px solid var(--accent); opacity: .0; animation: ring 1.3s ease-out infinite; }
  .title { font-weight: 800; line-height: 1.15; text-shadow: 0 3px 12px rgba(0,0,0,.75), 0 0 2px #000; }
  .title .hl { color: var(--accent); }
  .msg { font-size: .55em; font-weight: 600; max-width: 900px; text-shadow: 0 2px 9px rgba(0,0,0,.85); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes ring { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
  .in-fade { animation: fadeIn .5s ease-out both; }   .out-fade { animation: fadeIn .5s ease-in reverse both; }
  .in-slide { animation: slideIn .6s cubic-bezier(.2,.9,.3,1.2) both; } .out-slide { animation: slideOut .5s ease-in both; }
  .in-zoom { animation: zoomIn .5s cubic-bezier(.2,.9,.3,1.3) both; } .out-zoom { animation: zoomIn .45s ease-in reverse both; }
  .in-bounce { animation: bounceIn .8s both; }      .out-bounce { animation: zoomIn .45s ease-in reverse both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(80px); } to { opacity: 1; transform: none; } }
  @keyframes slideOut { to { opacity: 0; transform: translateY(-80px); } }
  @keyframes zoomIn { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
  @keyframes bounceIn {
    0% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1.08); }
    70% { transform: scale(.94); } 100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const ICONS = { follow: "💜", sub: "⭐", gift: "🎁", bits: "💎", raid: "🚀", superchat: "💰", member: "🏅", donation: "💸", patron: "❤️" };
// Built-in chimes (frequencies in Hz), synthesized so no audio files are needed.
const CHIMES = {
  follow: [659, 880], sub: [523, 659, 784, 1047], gift: [784, 988, 1175, 1568], bits: [1047, 1319, 1568],
  raid: [392, 523, 659, 784, 1047], superchat: [880, 1109, 1319], member: [523, 784, 1047],
  donation: [659, 831, 988, 1319], patron: [587, 740, 880, 1175],
};
const stage = document.getElementById("stage");
let cfg = null, queue = [], busy = false, skipNow = null, audioCtx = null;

async function loadConfig() {
  try { cfg = await (await fetch("/alerts/config", { cache: "no-store" })).json(); }
  catch { setTimeout(loadConfig, 2000); }
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function fill(tpl, ev) {
  const v = { name: ev.name, amount: ev.amount_text ?? ev.amount ?? "", count: ev.count ?? "", message: ev.message ?? "", platform: ev.platform };
  return esc(tpl).replace(/\{(name|amount|count|message|platform)\}/g, (_, k) => `<span class="hl">${esc(v[k])}</span>`);
}

function chime(kind, volume) {
  try {
    audioCtx = audioCtx || new AudioContext();
    const t0 = audioCtx.currentTime + 0.02;
    (CHIMES[kind] || CHIMES.follow).forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t = t0 + i * 0.12;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35 * volume, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.75);
    });
  } catch {}
}

function playSound(st, kind) {
  if (st.sound === "none") return;
  if (!st.sound) return chime(kind, st.volume);
  const a = new Audio("/alerts/media/" + encodeURIComponent(st.sound));
  a.volume = Math.max(0, Math.min(1, st.volume)); a.play().catch(() => {});
}

function mediaHtml(st, kind) {
  if (!st.image) return `<div class="icon ring">${ICONS[kind] || "🔔"}</div>`;
  const src = "/alerts/media/" + encodeURIComponent(st.image);
  return /\.(webm|mp4)$/i.test(st.image)
    ? `<div class="media"><video src="${src}" autoplay muted loop playsinline></video></div>`
    : `<div class="media"><img src="${src}"></div>`;
}

const wait = (ms) => new Promise((r) => { const t = setTimeout(r, ms); skipNow = () => { clearTimeout(t); r(); }; });

async function next() {
  if (busy || !queue.length) return;
  busy = true;
  const ev = queue.shift();
  const st = cfg && cfg.styles && cfg.styles[ev.kind];
  const allowed = st && st.enabled && !(st.min_amount > 0 && (ev.amount ?? 0) < st.min_amount);
  if (allowed) {
    const el = document.createElement("div");
    const anim = st.animation || "bounce";
    el.className = "alert in-" + anim;
    el.style.setProperty("--accent", st.accent_color);
    el.style.color = st.text_color;
    el.style.fontSize = (st.font_size || 44) + "px";
    el.innerHTML = mediaHtml(st, ev.kind) + `<div class="title">${fill(st.template, ev)}</div>` +
      (st.show_message && ev.message ? `<div class="msg">${esc(ev.message)}</div>` : "");
    stage.appendChild(el);
    playSound(st, ev.kind);
    await wait(Math.max(1500, st.duration_ms || 6000));
    el.className = "alert out-" + anim;
    await new Promise((r) => setTimeout(r, 500));
    el.remove();
    await new Promise((r) => setTimeout(r, (cfg && cfg.gap_ms) || 800));
  }
  busy = false; skipNow = null;
  next();
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/alerts`);
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.type === "alert") { queue.push(d.event); next(); }
    else if (d.type === "config") loadConfig();
    else if (d.type === "skip" && skipNow) skipNow();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
loadConfig().then(connect);
</script>
</body>
</html>
